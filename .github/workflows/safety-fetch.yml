name: Fetch 회수·폐기 / 행정처분 (수집·반영)

# 의약품안전나라 CCBAI01(회수·폐기) · CCBAO01(행정처분) 자동 수집.
#
# GMP 파이프라인과 달리 이쪽은 첨부 PDF 도, LLM 추출도 없어서 이 워크플로우 하나로
# 수집→병합→푸시가 끝난다(푸시하면 pages.yml 배포 + safety-notify.yml 메일).
#
# 식약처는 클라우드 IP 를 간헐 차단하므로 실패는 정상 상태로 취급하고 다음 회차에 재시도한다.
# 로컬 작업 스케줄러(NedrugGmpUpdate)가 같은 스크립트를 2시간마다 돌리므로,
# 이 워크플로우는 PC 가 꺼져 있을 때를 위한 안전망이다.

on:
  schedule:
    - cron: '35 */2 * * *'   # gmp-fetch(정각)와 겹치지 않게 35분에
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: safety-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 종료코드 1(접속 실패)은 경고만 남기고 초록으로 끝낸다 — 다음 회차에 저절로 낫는다.
      # 종료코드 2(표 구조·양식 변경)는 파서를 고쳐야 하는 일이므로 job 을 실패시킨다.
      # 예약 워크플로우 실패는 GitHub 이 저장소 소유자에게 메일로 알린다 = 조용한 실패 방지.
      - name: 식약처 목록·상세 수집 및 병합
        id: fetch
        run: |
          set +e
          node scripts/safety-fetch.mjs
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ $rc -eq 2 ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::목록/상세 표 구조가 바뀐 것으로 보입니다 — 파서(scripts/safety-common.mjs) 점검 필요."
            exit 1
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::식약처 접속 실패 — 다음 실행(2시간 후)에서 재시도합니다."
          fi
      - name: 변경분 커밋
        if: steps.fetch.outputs.ok == 'true'
        run: |
          git config user.name "nedrug-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/recall-data.json public/admin-data.json
          if git diff --cached --quiet; then
            echo "변화 없음 — 커밋 생략."
            exit 0
          fi
          # [skip ci] 를 붙이지 않는다 — 이 푸시가 배포·알림 워크플로우를 깨워야 한다.
          git commit -m "safety: 회수·폐기/행정처분 데이터 갱신"
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin main && git push origin HEAD:main && exit 0
            echo "push 재시도 $i"
            sleep 5
          done
          echo "push 실패" >&2
          exit 1
