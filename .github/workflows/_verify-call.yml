name: (임시) 재사용 호출 경로 검증

# safety-fetch / gmp-extract 가 커밋했을 때만 도는 deploy·notify 호출 경로를,
# 실제 신규 건을 기다리지 않고 그대로 재현해 본다.
# 호출자 권한(pages/id-token)과 secrets: inherit 이 제대로 넘어가는지가 확인 대상.
# 검증 후 삭제한다.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/pages.yml
    with:
      ref: main

  notify:
    # 데이터 변화가 없는 커밋이라 send=false 로 끝나야 정상(메일 안 나감).
    uses: ./.github/workflows/safety-notify.yml
    secrets: inherit
