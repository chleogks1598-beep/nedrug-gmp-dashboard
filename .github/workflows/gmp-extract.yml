name: Extract GMP 지적사항 (추출·반영)

# 수집(gmp-fetch.yml)이 끝나면 이어서 지적사항을 추출하고 data.json 에 반영한다.
#
# 원래 이 단계는 claude.ai 클라우드 루틴(매일 08시)이 담당했는데, 루틴 샌드박스에서
# git push 가 403 으로 막혀 2026-07-28 생성 이후 단 한 번도 성공하지 못했다.
# (GitHub 연결을 재인증해도 동일 — 쓰기 자격증명이 주입되지 않는 것으로 보인다.)
# Actions 는 push 가 되고 로그도 보이므로 수집·추출·배포가 한 시스템으로 합쳐진다.
#
# ★ 부분 성공을 커밋하지 않는다: 추출이 한 건이라도 실패하면 merge 없이 실패 처리한다.
#   일부만 반영하면 실패한 문서가 대시보드에 '적합'으로 잘못 표시되기 때문이다.

on:
  workflow_run:
    workflows: ["Fetch GMP 실사결과 (수집·감지)"]
    types: [completed]
  workflow_dispatch: {}

# pages/id-token 은 deploy 잡(pages.yml 재사용)에 필요하다.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gmp-extract
  cancel-in-progress: false

jobs:
  extract:
    outputs:
      committed: ${{ steps.push.outputs.committed }}
      sha: ${{ steps.push.outputs.sha }}
    # 수집이 실패한 회차는 pending 이 갱신되지 않았으므로 건너뛴다.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      # 수집 워크플로우가 방금 커밋한 pending/ 을 확실히 집어온다
      # (workflow_run 은 트리거 시점의 커밋을 체크아웃하므로 최신이 아닐 수 있다).
      - name: 최신 pending 받기
        run: git pull --rebase --autostash -q origin main

      - name: 신규 건 확인
        id: check
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          n=$(node -e "const m=require('./pending/manifest.json');console.log(m.length)" 2>/dev/null || echo 0)
          echo "미반영 신규 문서: ${n}건"
          # ANTHROPIC_API_KEY 가 없으면 이 경로는 잠들어 있는다.
          # 회사 정책상 유료 API 키를 못 쓰는 동안은 로컬 러너(run-local-update.cmd)가 추출을 담당한다.
          # 여기서 실패시키면 매번 빨간 실행만 쌓이므로, 조용히 건너뛰고 초록으로 끝낸다.
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::ANTHROPIC_API_KEY 미설정 — Actions 추출 경로는 대기 상태입니다. 로컬 러너가 처리합니다."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - name: 지적사항 추출 (Claude API)
        if: steps.check.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/extract.mjs

      - name: data.json 병합
        if: steps.check.outputs.count != '0'
        env:
          LIST_PATH: pending/list.json
          EXTRACTED_PATH: pending/extracted.json
        run: node scripts/merge.mjs

      # ★ 이 push 는 Pages 재배포·알림메일을 발화시키지 못한다 —
      #   GITHUB_TOKEN 으로 만든 푸시는 워크플로우를 트리거하지 않는다(GitHub 사양).
      #   그래서 아래 deploy·notify 잡에서 재사용 워크플로우로 직접 호출한다.
      - name: 커밋·푸시
        id: push
        if: steps.check.outputs.count != '0'
        run: |
          git config user.name "nedrug-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data.json
          if git diff --cached --quiet; then
            echo "data.json 변화 없음 — 커밋 생략."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: 실사결과 자동 갱신 (신규 ${{ steps.check.outputs.count }}건)"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin main && git push origin HEAD:main; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push 재시도 $i"
            sleep 5
          done
          echo "push 실패" >&2
          exit 1

  deploy:
    needs: extract
    if: needs.extract.outputs.committed == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.extract.outputs.sha }}

  notify:
    needs: extract
    if: needs.extract.outputs.committed == 'true'
    uses: ./.github/workflows/notify.yml
    with:
      ref: ${{ needs.extract.outputs.sha }}
    secrets: inherit
