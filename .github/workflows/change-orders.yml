name: Monitor 변경명령 (CCBAR01F012)

# PC 가 꺼져 있을 때를 위한 안전망. 평소 감시는 로컬 스케줄러가 한다
# (scripts/run-change-orders-update.mjs → change-orders-notify.yml).
# 식약처가 클라우드 IP 를 간헐 차단해 여기서는 3회 중 1회씩 UND_ERR_CONNECT_TIMEOUT 으로
# 실패했다(2026-09-10 확인) — 그래서 매시간에서 하루 1회로 줄였다. 실패해도 기준선을
# 전진시키지 않으므로 알림이 유실되지는 않는다.

on:
  schedule:
    - cron: '30 20 * * *'   # 매일 05:30 KST (20:30 UTC) — PC 가 꺼져 있던 밤 사이 보정
  workflow_dispatch:
    inputs:
      sample:
        description: '테스트 발송: 최근 N건으로 샘플 메일 (0=실제 감시)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: change-orders
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch & diff 변경명령
        id: mon
        env:
          SAMPLE: ${{ github.event.inputs.sample }}
        run: node scripts/change-orders.mjs
      - name: Send email via Gmail SMTP
        if: steps.mon.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: 변경명령 알림 <${{ secrets.MAIL_USERNAME }}>
          to: ${{ steps.mon.outputs.to }}
          subject: ${{ steps.mon.outputs.subject }}
          html_body: file://co-email-body.html
      - name: Promote baseline & commit
        if: success() && steps.mon.outputs.promote == 'true'
        run: |
          cp change-orders.current.json change-orders.json
          if ! git diff --quiet change-orders.json; then
            git config user.name "nedrug-bot"
            git config user.email "bot@users.noreply.github.com"
            git add change-orders.json
            git commit -m "monitor: 변경명령 스냅샷 갱신"
            git push
          else
            echo "기준선 변화 없음 — 커밋 생략."
          fi
