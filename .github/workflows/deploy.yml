name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Vercel project identifiers (not secret). Token comes from repo secret VERCEL_TOKEN.
env:
  VERCEL_ORG_ID: team_ymWhT5kAPGKhE8B7E3qsADFv
  VERCEL_PROJECT_ID: prj_lOjhJAGf4SAPqeRXkjtah1N8pGdv

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to production
        run: vercel deploy --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
