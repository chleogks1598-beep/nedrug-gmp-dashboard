name: Deploy to Vercel

# NOTE: 토큰 기반 CLI 배포가 이 프로젝트에서 "Building…"에 멈추는 이슈로,
# 자동 배포는 Vercel 네이티브 Git 연동을 사용합니다. 이 워크플로우는 수동 전용(fallback)입니다.
on:
  workflow_dispatch: {}

# Vercel project identifiers (not secret). Token comes from repo secret VERCEL_TOKEN.
env:
  VERCEL_ORG_ID: team_ymWhT5kAPGKhE8B7E3qsADFv
  VERCEL_PROJECT_ID: prj_lOjhJAGf4SAPqeRXkjtah1N8pGdv
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm i -g vercel@56.2.0
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build (static, local)
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
