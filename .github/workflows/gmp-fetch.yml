name: Fetch GMP 실사결과 (수집·감지)

# 식약처는 클라우드 IP를 간헐적으로 차단한다(측정: Actions 성공률 약 60%).
# 그래서 실패를 정상 상태로 취급하고 2시간마다 재시도한다 — 하루 안에 최소 한 번은 성공.
# 성공하면 신규 문서의 본문 텍스트를 pending/ 에 커밋하고, 08시 클라우드 루틴은
# 식약처에 접속하지 않고 지적사항 추출·병합·푸시만 담당한다.
#
# 조용한 실패 방지: scripts/pending-alert.mjs 가 ①26시간 넘게 미반영 ②24시간 넘게
# 수집 성공 없음 두 경우에 경고 메일을 보낸다.

on:
  schedule:
    - cron: '0 */2 * * *'   # 2시간마다 (UTC) — 08시 KST 추출 루틴 이전에 여러 번 시도
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gmp-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: pdftotext 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: npm ci
      - name: 식약처 목록 조회 · 신규 문서 수집
        id: fetch
        run: |
          if node scripts/fetch-new.mjs --pending; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::식약처 접속 실패 — 다음 실행(2시간 후)에서 재시도합니다."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      # ★ 원본 PDF 영구 보관: 식약처가 나중에 원문을 내려도 대시보드에서 계속 열리도록
      #   public/archive/<docId>.pdf 로 받아 커밋한다(이미 있는 건 건너뜀).
      - name: 원본 PDF 보관
        if: steps.fetch.outputs.ok == 'true'
        run: node scripts/archive-pdfs.mjs || echo "::warning::원본 보관 일부 실패 — 다음 실행에서 재시도"
      - name: 미반영·수집중단 감시
        id: alert
        env:
          FETCH_OK: ${{ steps.fetch.outputs.ok }}
        run: node scripts/pending-alert.mjs
      - name: Send email via Gmail SMTP
        if: steps.alert.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: GMP 수집알림 <${{ secrets.MAIL_USERNAME }}>
          to: ${{ steps.alert.outputs.to }}
          subject: ${{ steps.alert.outputs.subject }}
          html_body: file://gmp-pending-email.html
      - name: pending/ 커밋
        run: |
          git config user.name "nedrug-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A pending pending-state.json forms.json public/archive
          if git diff --cached --quiet; then
            echo "pending 변화 없음 — 커밋 생략."
            exit 0
          fi
          n=$(ls pending/*.txt 2>/dev/null | wc -l)
          git commit -m "fetch: 미반영 신규 문서 ${n}건 수집 [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin main && git push origin HEAD:main && exit 0
            echo "push 재시도 $i"
            sleep 5
          done
          echo "push 실패" >&2
          exit 1
