name: Fetch GMP 실사결과 (수집·감지)

# 식약처 수집은 GitHub Actions에서 수행한다(클라우드 루틴보다 MFDS 접속이 안정적).
# 신규 문서의 본문 텍스트를 pending/ 에 커밋해 두면, 08시 클라우드 루틴은
# MFDS에 접속하지 않고 지적사항 추출·병합·푸시만 담당한다.

on:
  schedule:
    - cron: '30 22 * * *'   # 07:30 KST — 08시 추출 루틴보다 앞서 실행
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gmp-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: pdftotext 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: npm ci
      - name: 식약처 목록 조회 · 신규 문서 수집
        run: node scripts/fetch-new.mjs --pending
      - name: 미반영 건 감지 · 경고 메일 준비
        id: alert
        run: node scripts/pending-alert.mjs
      - name: Send email via Gmail SMTP
        if: steps.alert.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: GMP 수집알림 <${{ secrets.MAIL_USERNAME }}>
          to: ${{ steps.alert.outputs.to }}
          subject: ${{ steps.alert.outputs.subject }}
          html_body: file://gmp-pending-email.html
      - name: pending/ 커밋
        if: success()
        run: |
          git config user.name "nedrug-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A pending pending-state.json
          if git diff --cached --quiet; then
            echo "pending 변화 없음 — 커밋 생략."
            exit 0
          fi
          n=$(ls pending/*.txt 2>/dev/null | wc -l)
          git commit -m "fetch: 미반영 신규 문서 ${n}건 수집 [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin main && git push origin HEAD:main && exit 0
            echo "push 재시도 $i"
            sleep 5
          done
          echo "push 실패" >&2
          exit 1
