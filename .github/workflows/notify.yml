name: Notify on data update

on:
  push:
    branches: [main]
    paths: ['public/data.json']
  workflow_dispatch:
    inputs:
      sample:
        description: '테스트 발송: 최근 N건으로 샘플 메일 (0=실제 diff)'
        required: false
        default: '0'

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Snapshot previous data.json
        run: git show HEAD~1:public/data.json > prev-data.json || echo "[]" > prev-data.json
      - name: Build email (diff vs previous)
        id: build
        env:
          SAMPLE: ${{ github.event.inputs.sample }}
        run: node scripts/build-email.mjs prev-data.json | tee build.out
      - name: Send email via Gmail SMTP
        if: steps.build.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: GMP 실사알림 <${{ secrets.MAIL_USERNAME }}>
          to: ${{ steps.build.outputs.to }}
          subject: ${{ steps.build.outputs.subject }}
          html_body: file://email-body.html
      - name: No email needed
        if: steps.build.outputs.send != 'true'
        run: echo "신규 레코드 없음 — 메일 발송 생략."
