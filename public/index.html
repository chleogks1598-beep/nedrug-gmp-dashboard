<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>의약품등 GMP 실사 결과공개 대시보드</title>
<style>
  :root{
    --bg:#f6f8fa; --surface:#ffffff; --surface-2:#f0f3f6; --border:#e2e8f0;
    --ink:#1a2733; --ink-2:#4a5966; --ink-3:#78889a;
    --accent:#1367d6; --accent-soft:#e7f0fc;
    --bar:#1c6fd0; --bar-soft:#dbe7f5;
    --ok:#0f8a5f; --ok-soft:#e2f4ec; --warn:#c2410c; --warn-soft:#fdece2;
    --shadow:0 1px 2px rgba(16,32,48,.06),0 2px 8px rgba(16,32,48,.05);
    --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e141b; --surface:#161e27; --surface-2:#1c2733; --border:#2a3846;
      --ink:#e6edf3; --ink-2:#a9b8c6; --ink-3:#748291;
      --accent:#4c9aff; --accent-soft:#16273c;
      --bar:#4c9aff; --bar-soft:#22384f;
      --ok:#3fce97; --ok-soft:#12291f; --warn:#f0894f; --warn-soft:#2c1a10;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
      --bg:#0e141b; --surface:#161e27; --surface-2:#1c2733; --border:#2a3846;
      --ink:#e6edf3; --ink-2:#a9b8c6; --ink-3:#748291;
      --accent:#4c9aff; --accent-soft:#16273c; --bar:#4c9aff; --bar-soft:#22384f;
      --ok:#3fce97; --ok-soft:#12291f; --warn:#f0894f; --warn-soft:#2c1a10;
  }
  :root[data-theme="light"]{
      --bg:#f6f8fa; --surface:#ffffff; --surface-2:#f0f3f6; --border:#e2e8f0;
      --ink:#1a2733; --ink-2:#4a5966; --ink-3:#78889a;
      --accent:#1367d6; --accent-soft:#e7f0fc; --bar:#3b82c4; --bar-soft:#cfe0f2;
      --ok:#0f8a5f; --ok-soft:#e2f4ec; --warn:#c2410c; --warn-soft:#fdece2;
      --bar:#1c6fd0; --bar-soft:#dbe7f5;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Malgun Gothic","맑은 고딕",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:20px 18px 64px}
  header.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin:8px 0 22px}
  header.top h1{font-size:22px;margin:0;letter-spacing:-.3px;font-weight:800}
  header.top .sub{color:var(--ink-2);font-size:13px;margin-top:4px}
  header.top .sub a{color:var(--accent);text-decoration:none}
  header.top .sub a:hover{text-decoration:underline}
  .spacer{flex:1}
  .theme-btn{background:var(--surface);border:1px solid var(--border);color:var(--ink-2);
    border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
  .theme-btn:hover{border-color:var(--accent)}

  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow)}
  .tile .k{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.2px}
  .tile .v{font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:6px;font-variant-numeric:tabular-nums}
  .tile .v.warn{color:var(--warn)} .tile .v.ok{color:var(--ok)}
  .tile .u{font-size:12px;color:var(--ink-3);margin-left:4px;font-weight:600}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow)}
  .card h2{font-size:14px;margin:0 0 14px;font-weight:700;color:var(--ink)}
  .card h2 .muted{color:var(--ink-3);font-weight:500;font-size:12px}

  .bars{display:flex;flex-direction:column;gap:9px}
  .barrow{display:grid;grid-template-columns:96px 1fr 46px;align-items:center;gap:10px;font-size:12.5px}
  .barrow .lbl{color:var(--ink-2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .barrow .track{background:var(--surface-2);border-radius:5px;height:16px;position:relative;overflow:hidden}
  .barrow .fill{display:block;background:var(--bar);height:100%;border-radius:5px;min-width:2px;transition:width .3s}
  .barrow .val{color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .barrow:hover .fill{filter:brightness(1.08)}

  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .filters input,.filters select{
    background:var(--surface);border:1px solid var(--border);color:var(--ink);
    border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit}
  .filters input{flex:1;min-width:200px}
  .filters input:focus,.filters select:focus{outline:none;border-color:var(--accent)}
  .filters .count{color:var(--ink-3);font-size:12.5px;margin-left:auto;font-weight:600}

  .tablewrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{background:var(--surface-2);color:var(--ink-2);text-align:left;font-weight:700;
    padding:11px 12px;font-size:12px;position:sticky;top:0;cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--border)}
  thead th:hover{color:var(--accent)}
  thead th .arw{opacity:.5;font-size:10px}
  tbody tr.main{border-bottom:1px solid var(--border);cursor:pointer}
  tbody tr.main:hover{background:var(--surface-2)}
  tbody td{padding:10px 12px;vertical-align:top}
  td.num{font-variant-numeric:tabular-nums;color:var(--ink-3);white-space:nowrap}
  td.site{font-weight:600;max-width:320px}
  td.site .addr{font-weight:400;color:var(--ink-3);font-size:11.5px;margin-top:2px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .badge.ok{background:var(--ok-soft);color:var(--ok)}
  .badge.warn{background:var(--warn-soft);color:var(--warn)}
  /* 식약처가 목록에서 내린 건(우리는 보존) */
  .badge.gone{background:var(--surface-2);color:var(--ink-3);border:1px dashed var(--border)}
  tr.main.gone td.site{color:var(--ink-2)}
  .gonenote{color:var(--ink-3);font-size:12px;margin-top:10px;padding:8px 10px;
    background:var(--surface-2);border-left:3px solid var(--ink-3);border-radius:4px}
  .chev{color:var(--ink-3);transition:transform .15s;display:inline-block}
  tr.main.open .chev{transform:rotate(90deg)}
  tr.detail td{background:var(--surface-2);padding:0}
  tr.detail .inner{padding:6px 14px 14px}
  .deftable{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  .deftable th{background:transparent;color:var(--ink-3);text-align:left;font-weight:700;padding:7px 8px;
    border-bottom:1px solid var(--border);position:static;cursor:default;font-size:11.5px}
  .deftable td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
  .deftable .fld{white-space:nowrap;color:var(--ink-2);font-weight:600}
  .deftable .law{white-space:nowrap;color:var(--ink-3);font-size:11.5px}
  .deftable .rmk{white-space:nowrap;color:var(--ok);font-size:11.5px;font-weight:600}
  .dl{display:inline-flex;align-items:center;gap:5px;color:var(--accent);text-decoration:none;
    font-size:12px;font-weight:600;margin-top:10px;border:1px solid var(--border);border-radius:7px;padding:5px 10px}
  .dl:hover{border-color:var(--accent);background:var(--accent-soft)}
  .none{color:var(--ink-3);font-style:italic;padding:8px 8px}

  .tt{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);
    padding:6px 9px;border-radius:6px;font-size:12px;font-weight:600;z-index:50;opacity:0;transition:opacity .1s;white-space:nowrap}
  footer{margin-top:26px;color:var(--ink-3);font-size:12px;text-align:center;line-height:1.7}
  .pager{display:flex;justify-content:center;gap:6px;margin-top:16px}
  .pager button{background:var(--surface);border:1px solid var(--border);color:var(--ink-2);
    border-radius:7px;padding:7px 12px;font-size:13px;cursor:pointer;min-width:38px}
  .pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .pager button:disabled{opacity:.4;cursor:default}
  .pager button.cur{background:var(--accent);color:#fff;border-color:var(--accent)}

  .ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .ghead h2{font-size:14px;margin:0;font-weight:700}
  .gtabs{display:flex;gap:3px;background:var(--surface-2);border-radius:8px;padding:3px}
  .gtab{border:0;background:transparent;color:var(--ink-2);padding:6px 13px;border-radius:6px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .gtab.active{background:var(--surface);color:var(--accent);font-weight:700;box-shadow:var(--shadow)}
  .bars.wide .barrow{grid-template-columns:150px 1fr 52px}
  .barrow.clk{cursor:pointer;border-radius:5px}
  .barrow.clk:hover{background:var(--surface-2)}
  .barrow.clk:hover .lbl{color:var(--accent)}
  .barrow.sel .fill{background:var(--warn)}
  .barrow.sel .lbl{color:var(--warn);font-weight:700}
  .gchip{display:inline-flex;align-items:center;gap:7px;background:var(--warn-soft);color:var(--warn);
    border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer;border:0}
  .gchip .x{font-weight:900}
  .deftable tr.hit td{background:var(--accent-soft)}

  /* 검색어 하이라이트 */
  mark.hl{background:#ffdf7e;color:#3a2a00;border-radius:3px;padding:0 1px;font-weight:700}
  @media (prefers-color-scheme: dark){ mark.hl{background:#8a6400;color:#ffeeb8} }
  :root[data-theme="dark"] mark.hl{background:#8a6400;color:#ffeeb8}
  :root[data-theme="light"] mark.hl{background:#ffdf7e;color:#3a2a00}
  .hitchip{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:20px;
    padding:1px 8px;font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap}

  /* 제형 */
  .forms{margin-top:3px;display:flex;flex-wrap:wrap;gap:3px}
  .fchip{display:inline-block;background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2);
    border-radius:6px;padding:1px 6px;font-size:11px;font-weight:600;white-space:nowrap;font-family:inherit}
  tr.main:hover .fchip{border-color:var(--border)}
  .fchip.na{font-style:italic;font-weight:500;color:var(--ink-3)}
  .metaline{color:var(--ink-3);font-size:12px;margin-top:10px}
  .metaline b{color:var(--ink-2);font-weight:700}
  @media (max-width:900px){ .tiles{grid-template-columns:repeat(2,1fr)} .grid2{grid-template-columns:1fr} }
  @media (max-width:560px){ td.site .addr{display:none} .barrow{grid-template-columns:80px 1fr 40px} .bars.wide .barrow{grid-template-columns:110px 1fr 44px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>의약품등 GMP 실사 결과공개 대시보드</h1>
      <div class="sub">
        출처: <a href="https://nedrug.mfds.go.kr/pbp/CCBBD03" target="_blank" rel="noopener">의약품안전나라 · 의약품등 GMP 실사 결과공개</a>
        · 최종 갱신 <b id="updated">—</b>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="theme-btn" id="themeBtn">◐ 테마</button>
  </header>

  <section class="tiles" id="tiles"></section>

  <section class="grid2">
    <div class="card">
      <h2>분야별 지적(보완)사항 건수 <span class="muted">(항목 기준)</span></h2>
      <div class="bars" id="chartField"></div>
    </div>
    <div class="card">
      <h2>국가별 실사 건수 <span class="muted">(상위 12)</span></h2>
      <div class="bars" id="chartCountry"></div>
    </div>
  </section>

  <section class="card" id="groupCard">
    <div class="ghead">
      <h2>유사 지적사항 빈도 <span class="muted" style="font-weight:500;color:var(--ink-3)">— 막대를 클릭하면 해당 지적사항만 아래 표에 필터됩니다</span></h2>
      <div class="gtabs">
        <button class="gtab active" data-view="topic">주제별</button>
        <button class="gtab" data-view="law">근거법령별</button>
      </div>
    </div>
    <div class="bars wide" id="groupBars"></div>
  </section>

  <section>
    <div class="filters">
      <input id="q" type="search" placeholder="제조소명·소재지·제형·지적사항 내용 검색…">
      <select id="fCountry"><option value="">전체 국가</option></select>
      <select id="fSterile">
        <option value="">무균/비무균 전체</option>
        <option value="무균">무균</option>
        <option value="비무균">비무균</option>
      </select>
      <select id="fForm"><option value="">전체 제형</option></select>
      <select id="fField"><option value="">전체 분야</option></select>
      <select id="fResult">
        <option value="">전체 결과</option>
        <option value="지적사항 있음">지적사항 있음</option>
        <option value="적합">적합</option>
        <option value="__gone__">식약처 공개 종료(보존본)</option>
      </select>
      <button class="gchip" id="gchip" style="display:none"></button>
      <span class="count" id="count"></span>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th data-sort="seq">순번<span class="arw"></span></th>
          <th data-sort="regDate">등록일<span class="arw"></span></th>
          <th data-sort="country">국가<span class="arw"></span></th>
          <th data-sort="site">제조소명<span class="arw"></span></th>
          <th data-sort="result">결과<span class="arw"></span></th>
          <th data-sort="defCount">지적<span class="arw"></span></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </section>

  <footer>
    본 페이지는 식품의약품안전처 의약품안전나라의 공개 데이터를 정리·시각화한 참고용 자료입니다.<br>
    지적(보완)사항 요약은 원본 PDF에서 자동 추출한 것으로, 정확한 내용은 각 행의 원본 문서를 확인하세요.
  </footer>
</div>

<div class="tt" id="tt"></div>

<script>
const DOWN_BASE="https://nedrug.mfds.go.kr/cmn/edms/down/";
let DATA=[], view=[], page=1, per=25, sortKey="regDate", sortDir=-1;
const $=s=>document.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 검색어 하이라이트 — 이스케이프한 뒤 이스케이프한 검색어로 매칭한다
let curQ="";
function hl(s){
  const t=esc(s);
  if(!curQ) return t;
  const q=esc(curQ).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  if(!q) return t;
  return t.replace(new RegExp(q,"gi"),m=>`<mark class="hl">${m}</mark>`);
}
// 제형 문자열에서 필터 축을 뽑는다 ("비무균-일반제제-내용고형제(정제)" → 제제유형/제형 토큰)
const formTokens=f=>f.split("-").slice(1)
  .map(p=>p.replace(/\([^)]*\)/g,"").replace(/[*]/g,"").trim()).filter(Boolean);
const recFormTokens=x=>[...new Set((x.forms||[]).flatMap(formTokens))];
const defHay=d=>((d.field||"")+" "+(d.gubun||"")+" "+(d.law||"")+" "+(d.summary||"")+" "+(d.remark||"")).toLowerCase();

// ── 유사 지적사항 그룹핑 ──
let activeGroup=null, groupView="topic";
const TAXONOMY=[
  {label:"밸리데이션·적격성",kw:["밸리데이션","적격성","검증"]},
  {label:"세척관리",kw:["세척"]},
  {label:"데이터 완전성",kw:["데이터","완전성"]},
  {label:"시험·검체 관리",kw:["시험","검체","시험법","역가","함량","순도","시액","표준품"]},
  {label:"교정·계측",kw:["교정","계측","눈금"]},
  {label:"문서·기록 관리",kw:["문서","기록","기준서","절차서","대장","일지","성적서"]},
  {label:"공급업체·원자재",kw:["공급업체","공급자","원자재","주성분","원료","공급","입고"]},
  {label:"환경·청정관리",kw:["환경","청정","차압","온습도","방충","방서","모니터링","무균","공조"]},
  {label:"교육·훈련",kw:["교육","훈련"]},
  {label:"안정성시험",kw:["안정성"]},
  {label:"제조공정·칭량",kw:["공정","칭량","혼합","건조"]},
  {label:"시설·설비·기기",kw:["시설","설비","기기","장비","용수","제조용수"]},
  {label:"변경·일탈·CAPA",kw:["변경관리","변경","일탈","시정","예방조치","capa","재발"]},
  {label:"자율점검·품질평가",kw:["자율점검","품질평가","연간품질","품질경영","품질검토","경영검토"]},
  {label:"포장·표시·라벨",kw:["포장","표시","라벨"]},
  {label:"보관·창고",kw:["보관","창고","저장"]},
  {label:"컴퓨터시스템",kw:["컴퓨터","전산","시스템"]},
  {label:"위생·복장",kw:["위생","복장","가운","갱의","손소독","마스크"]},
];
const normLaw=s=>(s||"").replace(/[가-힣]목/g,"").replace(/\s|제|호|[\[\]]/g,"");
function lawDisplay(s){
  s=s||"";
  const b=s.match(/별표\s*([0-9의]+)/), c=s.match(/([0-9]+(?:\.[0-9]+)+)\s*호?/) || s.match(/제\s*([0-9]+)\s*호/);
  if(b&&c) return `별표 ${b[1]} · ${c[1]}호`;
  return s.length>26?s.slice(0,26)+"…":s;
}
const defText=d=>((d.field||"")+" "+(d.summary||"")).toLowerCase();
function defInGroup(d,g){
  if(!g) return true;
  if(g.type==="topic") { const t=defText(d); return (g.kw||[]).some(k=>t.includes(k.toLowerCase())); }
  return normLaw(d.law)===g.key;
}

// theme toggle
const themeBtn=$("#themeBtn");
themeBtn.onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next=cur==="dark"?"light":(cur==="light"?"dark":(matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark"));
  document.documentElement.setAttribute("data-theme",next);
};

fetch("data.json").then(r=>r.json()).then(d=>{ DATA=d; init(); }).catch(e=>{
  $("#tbody").innerHTML='<tr><td colspan="6" class="none">데이터를 불러오지 못했습니다: '+esc(e.message)+'</td></tr>';
});

function init(){
  // updated date = max regDate
  const maxD=DATA.map(x=>x.regDate).filter(Boolean).sort().pop()||"—";
  $("#updated").textContent=maxD;
  renderTiles(); renderCharts(); fillSelects(); bindFilters();
  renderGroups(); bindGroups();
  apply();
}

function computeTopicRows(){
  const c=TAXONOMY.map(t=>({label:t.label,kw:t.kw,type:"topic",key:t.label,v:0}));
  for(const x of DATA) for(const d of (x.deficiencies||[])){ const t=defText(d);
    c.forEach(o=>{ if(o.kw.some(k=>t.includes(k.toLowerCase()))) o.v++; }); }
  return c.filter(o=>o.v>0).sort((a,b)=>b.v-a.v);
}
function computeLawRows(){
  const m={};
  for(const x of DATA) for(const d of (x.deficiencies||[])){ if(!d.law) continue; const k=normLaw(d.law); if(!k) continue;
    if(!m[k]) m[k]={v:0,disp:lawDisplay(d.law)}; m[k].v++; }
  return Object.entries(m).map(([k,o])=>({label:o.disp,type:"law",key:k,v:o.v})).sort((a,b)=>b.v-a.v).slice(0,15);
}
function renderGroups(){
  const rows=groupView==="topic"?computeTopicRows():computeLawRows();
  const max=Math.max(1,...rows.map(r=>r.v));
  const el=$("#groupBars");
  el.innerHTML=rows.map(r=>{
    const sel=activeGroup&&activeGroup.type===r.type&&activeGroup.key===r.key;
    return `<div class="barrow clk ${sel?'sel':''}" data-gtype="${esc(r.type)}" data-gkey="${esc(r.key)}" data-tip="${esc(r.label)}: ${r.v}건 (클릭하면 필터)">
      <span class="lbl" title="${esc(r.label)}">${esc(r.label)}</span>
      <span class="track"><span class="fill" style="width:${(r.v/max*100).toFixed(1)}%"></span></span>
      <span class="val">${r.v.toLocaleString()}</span></div>`;
  }).join("");
  el.querySelectorAll(".barrow.clk").forEach(b=>b.onclick=()=>{
    const row=rows.find(r=>r.type===b.dataset.gtype&&r.key===b.dataset.gkey); if(row) setGroup(row);
  });
}
function setGroup(row){
  if(activeGroup&&activeGroup.type===row.type&&activeGroup.key===row.key) activeGroup=null;
  else activeGroup={type:row.type,key:row.key,label:row.label,kw:row.kw||[]};
  page=1; renderGroups(); updateChip(); apply();
}
function updateChip(){
  const c=$("#gchip");
  if(activeGroup){ c.style.display="inline-flex"; c.innerHTML=`유형: ${esc(activeGroup.label)} <span class="x">✕</span>`; }
  else c.style.display="none";
}
function bindGroups(){
  document.querySelectorAll(".gtab").forEach(t=>t.onclick=()=>{
    document.querySelectorAll(".gtab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active"); groupView=t.dataset.view; renderGroups();
  });
  $("#gchip").onclick=()=>{ activeGroup=null; renderGroups(); updateChip(); page=1; apply(); };
}

function renderTiles(){
  const total=DATA.length;
  const withDef=DATA.filter(x=>x.defCount>0).length;
  const ok=total-withDef;
  const items=DATA.reduce((a,x)=>a+(x.defCount||0),0);
  const t=[
    {k:"공개 실사 건수",v:total,u:"건"},
    {k:"지적사항 있음",v:withDef,u:"건",cls:"warn"},
    {k:"적합 (지적없음)",v:ok,u:"건",cls:"ok"},
    {k:"총 지적(보완)항목",v:items,u:"항목"},
  ];
  $("#tiles").innerHTML=t.map(x=>`<div class="tile"><div class="k">${x.k}</div>
    <div class="v ${x.cls||''}">${x.v.toLocaleString()}<span class="u">${x.u}</span></div></div>`).join("");
}

function barChart(el,rows,fmt){
  const max=Math.max(1,...rows.map(r=>r.v));
  el.innerHTML=rows.map(r=>`<div class="barrow" data-tip="${esc(r.label)}: ${r.v}${fmt||''}">
    <span class="lbl" title="${esc(r.label)}">${esc(r.label)}</span>
    <span class="track"><span class="fill" style="width:${(r.v/max*100).toFixed(1)}%"></span></span>
    <span class="val">${r.v.toLocaleString()}</span></div>`).join("");
}
function renderCharts(){
  const fc={}; for(const x of DATA) for(const d of (x.deficiencies||[])){const f=(d.field||"미분류").trim()||"미분류"; fc[f]=(fc[f]||0)+1;}
  const fieldRows=Object.entries(fc).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([label,v])=>({label,v}));
  barChart($("#chartField"),fieldRows,"항목");
  const cc={}; for(const x of DATA){cc[x.country]=(cc[x.country]||0)+1;}
  const ctryRows=Object.entries(cc).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([label,v])=>({label,v}));
  barChart($("#chartCountry"),ctryRows,"건");
}

function fillSelects(){
  const cs=[...new Set(DATA.map(x=>x.country))].sort((a,b)=>a.localeCompare(b,"ko"));
  $("#fCountry").insertAdjacentHTML("beforeend",cs.map(c=>`<option>${esc(c)}</option>`).join(""));
  const fs=new Set(); for(const x of DATA) for(const d of (x.deficiencies||[])){if(d.field)fs.add(d.field.trim());}
  $("#fField").insertAdjacentHTML("beforeend",[...fs].sort((a,b)=>a.localeCompare(b,"ko")).map(c=>`<option>${esc(c)}</option>`).join(""));
  // 제형: 제제유형(…제제)과 세부 제형을 나눠 optgroup으로 묶는다
  const cnt={}; for(const x of DATA) for(const t of recFormTokens(x)) cnt[t]=(cnt[t]||0)+1;
  const toks=Object.entries(cnt).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"ko"));
  const kinds=toks.filter(([t])=>/제제$/.test(t)), shapes=toks.filter(([t])=>!/제제$/.test(t));
  const opts=g=>g.map(([t,n])=>`<option value="${esc(t)}">${esc(t)} (${n})</option>`).join("");
  let h="";
  if(kinds.length) h+=`<optgroup label="제제 유형">${opts(kinds)}</optgroup>`;
  if(shapes.length) h+=`<optgroup label="제형·제조방법">${opts(shapes)}</optgroup>`;
  const noForm=DATA.filter(x=>!(x.forms||[]).length).length;
  if(noForm) h+=`<optgroup label="기타"><option value="__none__">제형 미기재 (${noForm})</option></optgroup>`;
  $("#fForm").insertAdjacentHTML("beforeend",h);
}

function bindFilters(){
  ["#q","#fCountry","#fSterile","#fForm","#fField","#fResult"].forEach(s=>$(s).addEventListener("input",()=>{page=1;apply();}));
  document.querySelectorAll("thead th[data-sort]").forEach(th=>th.onclick=()=>{
    const k=th.dataset.sort;
    if(sortKey===k) sortDir*=-1; else {sortKey=k;sortDir=(k==="site"||k==="country")?1:-1;}
    apply();
  });
}

function apply(){
  const q=$("#q").value.trim().toLowerCase();
  curQ=$("#q").value.trim();
  const fc=$("#fCountry").value, ff=$("#fField").value, fr=$("#fResult").value;
  const fst=$("#fSterile").value, ffm=$("#fForm").value;
  view=DATA.filter(x=>{
    if(fc&&x.country!==fc) return false;
    if(fr==="__gone__"){ if(!x.delisted) return false; }
    else if(fr&&x.result!==fr) return false;
    if(ff && !(x.deficiencies||[]).some(d=>(d.field||"").trim()===ff)) return false;
    if(fst && !(x.sterile||"").split("+").includes(fst)) return false;
    if(ffm==="__none__"){ if((x.forms||[]).length) return false; }
    else if(ffm && !recFormTokens(x).includes(ffm)) return false;
    if(activeGroup && !(x.deficiencies||[]).some(d=>defInGroup(d,activeGroup))) return false;
    if(q){
      const hay=(x.site+" "+x.address+" "+x.country+" "+(x.forms||[]).join(" ")+" "
        +(x.deficiencies||[]).map(defHay).join(" ")).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  view.sort((a,b)=>{
    let av=a[sortKey], bv=b[sortKey];
    if(sortKey==="seq"||sortKey==="defCount"){av=+av;bv=+bv; return (av-bv)*sortDir;}
    av=(av==null?"":String(av)); bv=(bv==null?"":String(bv));
    return av.localeCompare(bv,"ko")*sortDir;
  });
  document.querySelectorAll("thead th[data-sort] .arw").forEach(a=>a.textContent="");
  const th=document.querySelector(`thead th[data-sort="${sortKey}"] .arw`); if(th)th.textContent=sortDir>0?" ▲":" ▼";
  $("#count").textContent=`${view.length.toLocaleString()}건 표시 / 전체 ${DATA.length.toLocaleString()}건`;
  renderTable();
}

function renderTable(){
  const pages=Math.max(1,Math.ceil(view.length/per));
  if(page>pages)page=pages;
  const rows=view.slice((page-1)*per,page*per);
  const tb=$("#tbody");
  if(!rows.length){tb.innerHTML='<tr><td colspan="6" class="none">조건에 맞는 결과가 없습니다.</td></tr>';$("#pager").innerHTML="";return;}
  const q=curQ.toLowerCase();
  tb.innerHTML=rows.map(x=>{
    const badge=(x.defCount>0?`<span class="badge warn">지적 ${x.defCount}</span>`:`<span class="badge ok">적합</span>`)
      + (x.delisted?` <span class="badge gone" title="식약처 목록에서 내려갔지만 이 대시보드에 보존된 자료입니다${x.delistedAt?" (감지 "+esc(x.delistedAt)+")":""}">공개종료</span>`:"");
    // 검색어가 지적사항 본문에 걸린 행은 펼친 채로 보여준다 — 어디에 걸렸는지 바로 보이도록
    const hits=q?(x.deficiencies||[]).filter(d=>defHay(d).includes(q)).length:0;
    const open=hits>0;
    const chip=hits?`<span class="hitchip">지적사항 일치 ${hits}</span>`:"";
    const forms=(x.forms||[]).length
      ? `<div class="forms">${x.forms.map(f=>`<span class="fchip">${hl(f)}</span>`).join("")}</div>`
      : (x.sterile?`<div class="forms"><span class="fchip na">${esc(x.sterile)} · 제형 미기재</span></div>`:"");
    return `<tr class="main${open?" open":""}${x.delisted?" gone":""}" data-id="${esc(x.docId)}">
      <td class="num"><span class="chev">▸</span> ${x.seq}</td>
      <td class="num">${esc(x.regDate)}</td>
      <td>${hl(x.country)}</td>
      <td class="site">${hl(x.site)}${chip}<div class="addr">${hl(x.address)}</div>${forms}</td>
      <td>${badge}</td>
      <td class="num">${x.defCount||0}</td>
    </tr>
    <tr class="detail" data-for="${esc(x.docId)}" style="display:${open?"table-row":"none"}"><td colspan="6"><div class="inner">${detailHtml(x)}</div></td></tr>`;
  }).join("");
  tb.querySelectorAll("tr.main").forEach(tr=>tr.onclick=()=>{
    const d=tb.querySelector(`tr.detail[data-for="${CSS.escape(tr.dataset.id)}"]`);
    const open=d.style.display!=="none"; d.style.display=open?"none":"table-row"; tr.classList.toggle("open",!open);
  });
  renderPager(pages);
}

function detailHtml(x){
  let h="";
  const q=curQ.toLowerCase();
  if((x.forms||[]).length){
    h+=`<div class="metaline"><b>제형</b> — ${x.forms.map(f=>`<span class="fchip">${hl(f)}</span>`).join(" ")}</div>`;
  } else {
    h+=`<div class="metaline"><b>제형</b> — <span class="fchip na">원본에 제형 표 없음${x.sterile?" ("+esc(x.sterile)+" 표기)":""}</span></div>`;
  }
  if((x.deficiencies||[]).length){
    h+=`<table class="deftable"><thead><tr><th>분야</th><th>구분</th><th>근거법령</th><th>지적(보완)사항 요약</th><th>비고</th></tr></thead><tbody>`;
    h+=x.deficiencies.map(d=>{
      const cls=[activeGroup&&defInGroup(d,activeGroup)?"hit":"",q&&defHay(d).includes(q)?"hit":""].filter(Boolean)[0]||"";
      return `<tr class="${cls}">
      <td class="fld">${hl(d.field)}</td><td class="fld">${hl(d.gubun)}</td>
      <td class="law">${hl(d.law)}</td><td>${hl(d.summary)}</td>
      <td class="rmk">${hl(d.remark)}</td></tr>`;
    }).join("");
    h+=`</tbody></table>`;
  } else {
    h+=`<div class="none">지적(보완)사항 없음 — 적합 판정.</div>`;
  }
  const period=(x.inspStart||"")+(x.inspEnd&&x.inspEnd!==x.inspStart?" ~ "+x.inspEnd:"");
  // 보존본(아카이브)이 있으면 그걸 먼저 — 식약처가 원문을 내려도 계속 열린다.
  if(x.archiveFile){
    const isHwpx=/\.hwpx$/i.test(x.archiveFile);
    h+=`<a class="dl" href="archive/${esc(x.archiveFile)}" target="_blank" rel="noopener">⬇ 실사결과서 보존본 (${isHwpx?"HWPX":"PDF"})</a> `;
  }
  h+=`<a class="dl" href="${DOWN_BASE}${esc(x.docId)}" target="_blank" rel="noopener">⬇ ${x.archiveFile?"식약처 원문":"원본 실사결과서 (PDF)"}</a>`;
  if(x.delisted) h+=`<div class="gonenote">이 자료는 식약처 공개 목록에서 내려갔습니다${x.delistedAt?` (감지일 ${esc(x.delistedAt)})`:""}. 이 대시보드가 보존한 사본이며, 식약처 원문 링크는 열리지 않을 수 있습니다.</div>`;
  if(period) h+=`<span style="color:var(--ink-3);font-size:12px;margin-left:12px">실사기간: ${esc(period)} · 구분: ${esc(x.prePost)} · ${esc(x.type)}</span>`;
  return h;
}

function renderPager(pages){
  if(pages<=1){$("#pager").innerHTML="";return;}
  const btn=(p,l,cur,dis)=>`<button ${dis?"disabled":""} class="${cur?'cur':''}" data-p="${p}">${l}</button>`;
  let h=btn(page-1,"‹",false,page===1);
  const win=2; const set=new Set([1,pages,page]);
  for(let i=page-win;i<=page+win;i++) if(i>=1&&i<=pages)set.add(i);
  const arr=[...set].sort((a,b)=>a-b); let prev=0;
  for(const p of arr){ if(p-prev>1)h+=`<button disabled>…</button>`; h+=btn(p,p,p===page,false); prev=p; }
  h+=btn(page+1,"›",false,page===pages);
  $("#pager").innerHTML=h;
  $("#pager").querySelectorAll("button[data-p]").forEach(b=>b.onclick=()=>{page=+b.dataset.p;renderTable();scrollTo({top:$(".filters").offsetTop-10,behavior:"smooth"});});
}

// tooltip for bars
const tt=$("#tt");
document.addEventListener("mousemove",e=>{
  const el=e.target.closest("[data-tip]");
  if(el){tt.textContent=el.dataset.tip;tt.style.opacity="1";tt.style.left=(e.clientX+12)+"px";tt.style.top=(e.clientY+12)+"px";}
  else tt.style.opacity="0";
});
</script>
</body>
</html>
